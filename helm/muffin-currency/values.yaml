replicaCount: 1

image:
  repository: enzhine/muffin-currency
  pullPolicy: IfNotPresent
  tag: "1.2.2"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8083
  targetPort: 8080

resources: {}

livenessProbe:
  httpGet:
    path: /rate?from=PLAIN&to=CHOKOLATE
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /rate?from=PLAIN&to=CHOKOLATE
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5

envFrom:
  - configMapRef:
      name: muffin-currency-env

nodeSelector: {}

tolerations: []

affinity: {}

envsConfigMap:
  name: muffin-currency-env
  data:
    SERVICE_NAME: muffin-currency
    OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector-collector.monitoring:4317

volumes: {}

volumeMounts: {}
