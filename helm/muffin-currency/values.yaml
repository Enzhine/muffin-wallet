replicaCount: 1

image:
  repository: enzhine/muffin-currency
  pullPolicy: IfNotPresent
  tag: "1.2.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8083
  targetPort: 8080

resources: {}

livenessProbe:
  httpGet:
    path: /rate?from=PLAIN&to=CHOKOLATE
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /rate?from=PLAIN&to=CHOKOLATE
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}

volumes:
  - name: alloy-config-volume
    configMap:
      name: muffin-currency-alloy
  - name: application-logs-volume
    emptyDir: {}

volumeMounts:
  - name: application-logs-volume
    mountPath: /logs

alloy:
  image:
    repository: grafana/alloy
    tag: v1.13.0-rc.2
  volumeMounts:
    - name: alloy-config-volume
      mountPath:  /etc/alloy
    - name: application-logs-volume
      mountPath: /var/log/app
      readOnly: true
  filesConfigMap:
    name: muffin-currency-alloy
    files:
      - "config.alloy"
