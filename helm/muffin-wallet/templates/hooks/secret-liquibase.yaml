apiVersion: v1
kind: Secret
metadata:
  name: muffin-wallet-liquibase
  labels:
    {{- include "muffin-wallet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete,post-rollback,pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  LIQUIBASE_PASSWORD: {{ .Values.liquibase.passwordB64 }}
