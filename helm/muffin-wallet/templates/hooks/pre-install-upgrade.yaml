apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "muffin-wallet.fullname" . }}
  labels:
    {{- include "muffin-wallet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}
      labels:
        {{- include "muffin-wallet.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-upgrade
          image: "liquibase/liquibase:5.0"
          command:
            - "/bin/sh"
            - "-c"
            - |
              wget -O /liquibase/lib/postgresql.jar https://jdbc.postgresql.org/download/postgresql-42.6.0.jar
              
              echo "=== Checking file structure ==="
              echo "Current directory: $(pwd)"
              echo "LS of /liquibase:"
              ls -la /liquibase/
              echo "LS of /liquibase/changelog:"
              ls -la /liquibase/changelog/
              echo "LS of /liquibase/changelog/ recursively:"
              find /liquibase/changelog/ -type f -name "*.yaml" -o -name "*.yml" -o -name "*.xml" | head -20
              
              echo "=== File contents ==="
              find /liquibase/changelog/ -name "*.yaml" -o -name "*.yml" | while read file; do
                echo "=== $file ==="
                head -5 "$file"
              done
              
              echo "=== Testing file existence ==="
              test -f /liquibase/changelog/db.changelog-master.yaml && echo "MASTER FILE EXISTS" || echo "MASTER FILE MISSING"
              
              liquibase \
              --driver={{ .Values.liquibase.driver }} \
              --url={{ .Values.liquibase.url }} \
              --changeLogFile=/liquibase/changelog/db.changelog-master.yaml \
              --username={{ .Values.liquibase.username }} \
              --password=$LIQUIBASE_PASSWORD \
              update
          volumeMounts:
            - name: liquibase-volume
              mountPath: /liquibase/changelog
          envFrom:
            - secretRef:
                name: muffin-wallet-liquibase
      volumes:
        - name: liquibase-volume
          configMap:
            name: muffin-wallet-liquibase
